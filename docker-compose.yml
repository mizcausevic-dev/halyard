services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: halyard
      POSTGRES_PASSWORD: halyard
      POSTGRES_DB: halyard
    ports:
      - "5432:5432"
    volumes:
      - halyard_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halyard -d halyard"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  halyard_pg:
